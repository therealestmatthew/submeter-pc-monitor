[sampling]
mode = "adaptive"
active_interval = "2s"
idle_interval = "5s"
idle_after = "60s"
uss_interval = "30s"
uss_top_n = 25
on_battery_multiplier = 2

[sampling.overhead_limit]
idle = "1%"
active = "3%"

[storage]
disk_budget = "2GB"
keyframe_interval = "10m"
retention = { raw = "48h", executables = "1y" }
backups = { keep = 3 }

[analysis.leak]
min_duration = "2h"
min_slope = "50MB/h"

[alerts]
cooldown = "15m"

[[alerts.rules]]
name = "agents eating the machine"
workload = "agent:*"
metric = "cpu_cores"
above = 12
for = "5m"
severity = "warning"

[attribution]
rules_file = "rules.toml"
max_workload_names = 200

[privacy]
redaction = "scrub"
